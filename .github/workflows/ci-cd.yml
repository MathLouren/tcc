name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Mesmo PyTorch (só CPU) da imagem Docker; evita baixar a versão com GPU.
          pip install torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no servidor
    needs: [testes, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: producao
      url: https://chatbotuniverso.duckdns.org
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Executar deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # A chave só executa /usr/local/bin/chatbot-deploy no servidor; o sha vai como argumento.
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Verificar site público
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://chatbotuniverso.duckdns.org/health; then exit 0; fi
            sleep 5
          done
          echo "site público não respondeu ao /health"; exit 1
