name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Mesmo PyTorch (só CPU) da imagem Docker; evita baixar a versão com GPU.
          pip install torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest

  busca:
    name: Qualidade da busca (gabarito, sem LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_VERBOSITY: error
      # Mesma configuração de recuperação usada em produção (ver deploy/README.md).
      RERANKER_MODELO: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache dos modelos (embeddings e reranker)
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-e5-base-mmarco-v1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Termos esperados presentes nos trechos enviados ao modelo
        # Indexa os documentos do repositório numa pasta temporária e mede o gabarito (122 perguntas).
        # Medido em 2026-11-22 com esta configuração: 121 de 122. Abaixo do mínimo, o deploy não acontece.
        run: python avaliacao/diagnostico_busca.py --termos --construir --top-k 3 --margem 0.025 --minimo 118

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no servidor
    needs: [testes, busca, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: producao
      url: https://chatbotuniverso.duckdns.org
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Executar deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # A chave só executa /usr/local/bin/chatbot-deploy no servidor; o sha vai como argumento.
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Verificar site público
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://chatbotuniverso.duckdns.org/health; then exit 0; fi
            sleep 5
          done
          echo "site público não respondeu ao /health"; exit 1
